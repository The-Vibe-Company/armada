name: Armada
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "26.0"
configs:
  Debug: debug
  Release: release
packages:
  ArmadaKit:
    path: ArmadaKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: K28B69CWQ7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  Armada:
    type: application
    platform: iOS
    sources:
      - path: Armada
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: Armada
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
    dependencies:
      - package: ArmadaKit
        product: ArmadaKit
schemes:
  Armada:
    build:
      targets:
        Armada: all
    run:
      config: Debug
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
