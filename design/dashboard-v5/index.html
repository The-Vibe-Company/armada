<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Armada · dashboard v5 · Night watch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <nav class="side" id="side" aria-label="Armada"></nav>
      <main class="deck" id="deck" data-horizon="yours"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <aside class="dpanel" id="dpanel" aria-label="Prototype controls"></aside>
    <script src="./app.js"></script>
  </body>
</html>
