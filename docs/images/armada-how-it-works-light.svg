<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="588" viewBox="0 0 1280 588" role="img" aria-labelledby="t d">
<title id="t">How Armada works</title>
<desc id="d">Four steps. Golden: your repositories are cloned over your GitHub connection, set up, scanned for secrets and snapshotted per provider. Launch: Claude Code or Codex with an explicit model and effort, on Boat or Modal, with your connected MCP servers. Sandbox: a fresh fork where git acts as you and only that agent's keys are present. Drive: follow events, send, steer, interrupt, exec, stop and resume. The web dashboard, the armada CLI and the Armada MCP server all go through the same server policies.</desc>
<rect width="1280" height="588" rx="24" fill="#fbfbf9"/>
<rect x="0.5" y="0.5" width="1279" height="587" rx="23.5" fill="none" stroke="#dcdcd6"/>
<g transform="translate(48 48)">
<rect width="272" height="392" rx="16" fill="#ffffff" stroke="#dcdcd6"/>
<path d="M36 22L54 52H18Z" fill="#b6f15a"/>
<text x="70" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#6b6d74">01</text>
<text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.6" fill="#111214">Golden</text>
<text x="24" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#3f6b00">Build once, reuse</text>
<text x="24" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#3d3f45">Your repos, cloned over</text>
<text x="24" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#3d3f45">your GitHub connection</text>
<text x="24" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#3d3f45">Setup script, then a</text>
<text x="24" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#3d3f45">fail-closed secret scan</text>
<text x="24" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#3d3f45">Snapshot per provider</text>
<rect x="16" y="332" width="240" height="40" rx="10" fill="#f1f1ec"/>
<text x="30" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#111214"><tspan fill="#3f6b00">$</tspan>&#160;armada golden create</text>
</g>
