name: Release

# On every push to main, release-please opens or updates the release pull
# request. The weekday train (or a manual run for an urgent fix) merges it,
# then release-please tags it and publish puts the CLI on npm in the same run.
# A GITHUB_TOKEN merge starts no new run. Publishing uses Trusted Publishing
# (GitHub OIDC): no npm token exists in this repository or its secrets.
# npmjs.com trusts this workflow by its file name, release.yml: keep it.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1-5" # 07:00 UTC, Monday to Friday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  train:
    name: Merge the release pull request
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pending release for main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --base main --label "autorelease: pending" --state open --limit 2 --json number,headRefOid)
          case "$(jq 'length' <<< "$prs")" in
            0) echo "No pending release pull request." ;;
            1) gh pr merge "$(jq -r '.[0].number' <<< "$prs")" --squash \
                 --match-head-commit "$(jq -r '.[0].headRefOid' <<< "$prs")" ;;
            *) echo "More than one pending release pull request for main; inspect before releasing." >&2; exit 1 ;;
          esac

  release-please:
    name: Release pull request
    needs: train
    if: always() # Pushes skip train but still update the release pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1; Node 24 ships npm 11.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - run: bun install --frozen-lockfile
      - name: Install the pinned test browser and system libraries
        uses: ./.github/actions/test-browser
      # Release pull requests are opened with GITHUB_TOKEN, so CI never ran on them.
      - run: bun run verify
      # prepack generates the skills and builds dist/armada.js, then npm publishes over OIDC.
      - run: npm publish --provenance --access public
        working-directory: packages/cli
