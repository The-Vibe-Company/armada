name: Release

# On every push to main, release-please opens or updates the release pull
# request. The weekday train (or a manual run for an urgent fix) merges it,
# then release-please tags it; publish puts the CLI on npm and desktop attaches
# the macOS app to the GitHub release, in the same run and in parallel.
# A GITHUB_TOKEN merge starts no new run. Publishing uses Trusted Publishing
# (GitHub OIDC): no npm token exists in this repository or its secrets.
# npmjs.com trusts this workflow by its file name, release.yml: keep it.
#
# `gh workflow run release.yml --ref <ref> -f desktop_only=true` builds the
# macOS app from that ref as a downloadable artifact only: no merge, no tag,
# no publication, and a concurrency group of its own so it never waits in,
# or is cancelled from, the release train's.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1-5" # 07:00 UTC, Monday to Friday
  workflow_dispatch:
    inputs:
      desktop_only:
        description: Build the macOS app from this ref as an artifact only (no release, merge or publication)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.desktop_only && format('release-desktop-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

jobs:
  train:
    name: Merge the release pull request
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.desktop_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pending release for main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --base main --label "autorelease: pending" --state open --limit 2 --json number,headRefOid)
          case "$(jq 'length' <<< "$prs")" in
            0) echo "No pending release pull request." ;;
            1) gh pr merge "$(jq -r '.[0].number' <<< "$prs")" --squash \
                 --match-head-commit "$(jq -r '.[0].headRefOid' <<< "$prs")" ;;
            *) echo "More than one pending release pull request for main; inspect before releasing." >&2; exit 1 ;;
          esac

  release-please:
    name: Release pull request
    needs: train
    # Pushes skip train but still update the release pull request; a desktop-only build skips both.
    if: always() && !inputs.desktop_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1; Node 24 ships npm 11.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - run: bun install --frozen-lockfile
      - name: Install the pinned test browser and system libraries
        uses: ./.github/actions/test-browser
      # Release pull requests are opened with GITHUB_TOKEN, so CI never ran on them.
      - run: bun run verify
      # prepack generates the skills and builds dist/armada.js, then npm publishes over OIDC.
      - run: npm publish --provenance --access public
        working-directory: packages/cli

  desktop:
    name: Build the macOS app
    # The app at the version release-please just tagged (release-please bumps
    # packages/desktop/package.json with the CLI's), attached to that release
    # beside the npm publish; or, on a desktop-only dispatch, an artifact built
    # from the dispatched ref. The DMG is signed and notarised only when the
    # five Apple secrets exist (docs/runbook.md, "Ship the desktop app with the
    # release train"); the release notes say when it is not.
    needs: release-please
    if: ${{ !cancelled() && (inputs.desktop_only || needs.release-please.outputs.release_created == 'true') }}
    runs-on: macos-14 # Apple Silicon: the app is built for arm64 only
    timeout-minutes: 45
    permissions:
      contents: write # upload the assets to the release; the artifact needs nothing
    env:
      RELEASE: ${{ !inputs.desktop_only && needs.release-please.outputs.release_created == 'true' }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.desktop_only && github.sha || needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Decide whether the app is signed
        id: signing
        # All five or none: a certificate alone would sign without notarising, an
        # Apple account alone has nothing to sign with. The values are only tested
        # for presence, never printed.
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "The app will be signed and notarised."
          elif [ "${#missing[@]}" -eq 5 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple signing secrets: the DMG is built unsigned (docs/runbook.md, Ship the desktop app with the release train)."
          else
            echo "::error::Some Apple signing secrets are missing (${missing[*]}): set all five or none."
            exit 1
          fi
      - name: Import the certificate into a temporary keychain
        if: steps.signing.outputs.signed == 'true'
        # electron-builder signs with the identity it finds in CSC_KEYCHAIN. The
        # keychain's password is drawn here and masked; the decoded certificate
        # is removed at once, the keychain in the always() step below.
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/armada-release.keychain-db"
          certificate="$RUNNER_TEMP/armada-release.p12"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Keep the runner's keychains in the search list behind the new one.
          existing=()
          while IFS= read -r line; do existing+=("$line"); done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build the dmg and the zip
        # Any of the Apple variables turns electron-builder's signing on and all
        # three its notarisation (packages/desktop/src/packaging.ts); empty
        # values leave both off and no certificate is looked for.
        env:
          APPLE_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: bun run --cwd packages/desktop dist
      - name: Delete the temporary keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/armada-release.p12"
          keychain="$RUNNER_TEMP/armada-release.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
      - name: Check the build
        # The version is the tag's (through release-please's extra-files), the
        # app is arm64, the keyring's native binding left the asar as
        # packaging.ts says, and a signed app verifies.
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          if [ "$RELEASE" = true ] && [ "v$version" != "$TAG" ]; then
            echo "::error::packages/desktop/package.json is $version but the release is $TAG"
            exit 1
          fi
          for file in "Armada-$version-arm64.dmg" "Armada-$version-arm64-mac.zip" latest-mac.yml; do
            test -f "release/$file" || { echo "::error::release/$file was not built"; exit 1; }
          done
          ls release/*.blockmap > /dev/null
          grep -qx "version: $version" release/latest-mac.yml
          lipo -archs release/mac-arm64/Armada.app/Contents/MacOS/Armada | grep -qx arm64
          find release/mac-arm64/Armada.app/Contents/Resources/app.asar.unpacked -name '*darwin-arm64*.node' | grep -q .
          if [ "$SIGNED" = true ]; then codesign --verify --deep --strict release/mac-arm64/Armada.app; fi
          ls -l release/Armada-* release/latest-mac.yml
      - name: Upload the app as an artifact
        if: inputs.desktop_only
        uses: actions/upload-artifact@v4
        with:
          name: armada-desktop-macos-arm64
          path: |
            packages/desktop/release/Armada-*.dmg
            packages/desktop/release/Armada-*.zip
            packages/desktop/release/latest-mac.yml
            packages/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - name: Attach the app to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        working-directory: packages/desktop/release
        run: |
          set -euo pipefail
          gh release upload "$TAG" Armada-*.dmg Armada-*.zip latest-mac.yml ./*.blockmap --clobber
          notes=$(gh release view "$TAG" --json body --jq .body)
          if grep -q '^## macOS app' <<< "$notes"; then exit 0; fi # a rerun: the section is there
          # shellcheck disable=SC2016 # the backticks are the notes' Markdown
          {
            printf '%s\n\n## macOS app\n\n' "$notes"
            printf 'Apple Silicon: download `%s`, open it and drag Armada to Applications.\n' Armada-*.dmg
            if [ "$SIGNED" = true ]; then
              printf 'The app is signed and notarised.\n'
            else
              printf 'This build is **unsigned**: macOS quarantines it. After copying it to Applications, run `xattr -dr com.apple.quarantine /Applications/Armada.app` once (packages/desktop/README.md).\n'
            fi
          } | gh release edit "$TAG" --notes-file -
