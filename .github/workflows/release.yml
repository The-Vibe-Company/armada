name: Release

# Release Please opens the version PR on main. Merging it creates the release tag and
# publishes in this same workflow: GITHUB_TOKEN-created tags do not trigger tag workflows.
# Tag pushes also work; manual runs are dry runs unless a tag and publish=true are supplied.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<version> tag (empty: dry-run the selected ref)"
        type: string
        default: ""
      publish:
        description: "Publish/recover the existing tag instead of a dry run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-production
  queue: max
  cancel-in-progress: false

jobs:
  publication-intent:
    name: Decide publication intent without deployment credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.intent.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide publication intent
        id: intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          REQUESTED_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$EVENT_NAME" == push && "$SOURCE_REF" == refs/heads/main ]]; then
            version=$(jq -er .version packages/core/package.json)
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]] || { echo "::error::Invalid release version; no publication authorized."; exit 1; }
            response="$RUNNER_TEMP/release-metadata-response"
            trap 'rm -f "$response"' EXIT
            # HTTP metadata only. A failed API request is never treated as 'already published'.
            gh api --include "repos/$GH_REPO/releases/tags/v$version" > "$response" 2>/dev/null || true
            status=$(awk '/^HTTP\// { print $2; exit }' "$response")
            case "$status" in
              200) publish=false ;;
              404) publish=true ;;
              *) echo "::error::Cannot verify release publication intent; no publication authorized."; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == push && "$SOURCE_REF" == refs/tags/v* ]]; then
            publish=true
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$REQUESTED_PUBLISH" == true || "$REQUESTED_PUBLISH" == false ]] || exit 1
            publish="$REQUESTED_PUBLISH"
          else
            echo "::error::Unsupported release event; no publication authorized."
            exit 1
          fi
          if [[ "$publish" == true && "$SOURCE_REF" != refs/heads/main ]]; then
            [[ "$SOURCE_REF" == refs/tags/v* ]] || { echo "::error::Publishing requires main or a version tag."; exit 1; }
          fi
          if [[ "$publish" == true && "$EVENT_NAME" != push || "$publish" == true && "$SOURCE_REF" != refs/heads/main ]]; then
            [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" == "v$(jq -r .version packages/core/package.json)" ]] || { echo "::error::Publishing requires a matching existing version tag."; exit 1; }
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]] && git merge-base --is-ancestor HEAD origin/main || { echo "::error::Publishing tag must belong to main."; exit 1; }
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  release-configuration:
    name: Check ${{ matrix.environment }} release configuration
    needs: publication-intent
    if: needs.publication-intent.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ matrix.environment }}
    steps:
      - name: Require release configuration before any publication
        env:
          RELEASE_ENVIRONMENT: ${{ matrix.environment }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ARMADA_SERVER_URL: ${{ secrets.ARMADA_SERVER_URL }}
          ARMADA_SMOKE_TOKEN: ${{ matrix.environment == 'staging' && secrets.ARMADA_SMOKE_TOKEN || '' }}
          ARMADA_SMOKE_CASES: ${{ matrix.environment == 'staging' && secrets.ARMADA_SMOKE_CASES || '' }}
          ARMADA_ORIGIN: ${{ matrix.environment == 'staging' && vars.ARMADA_ORIGIN || '' }}
        run: |
          set -euo pipefail
          case "$RELEASE_ENVIRONMENT" in staging|production) ;; *) echo "::error::Unsupported release configuration environment."; exit 1 ;; esac
          required=(SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
            RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID
            VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID ARMADA_SERVER_URL)
          if [[ "$RELEASE_ENVIRONMENT" == staging ]]; then
            required+=(ARMADA_SMOKE_TOKEN ARMADA_SMOKE_CASES ARMADA_ORIGIN)
          fi
          missing=()
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing release configuration ($RELEASE_ENVIRONMENT): ${missing[*]}"
            exit 1
          fi

  release-please:
    name: Prepare the version PR or GitHub release
    needs: [publication-intent, release-configuration]
    if: ${{ !cancelled() && needs.publication-intent.result == 'success' && (needs.publication-intent.outputs.publish != 'true' || needs.release-configuration.result == 'success') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Publication is disabled on ordinary preparation runs, not merely inferred.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # Explicitly dispatch CI for bot-authored release PRs.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          skip-github-release: ${{ needs.publication-intent.outputs.publish != 'true' }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
      - uses: ./.github/actions/setup-bun
        if: steps.release.outputs.prs_created == 'true'
      - name: Sync Bun's workspace versions and run release PR checks
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          bun install --lockfile-only --ignore-scripts
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m "chore(release): synchronize Bun workspace versions"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
          # Neither PR creation nor this bot push triggers pull_request/push CI.
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"

  check:
    name: Check the version and the tests
    needs: [publication-intent, release-configuration, release-please]
    if: ${{ !cancelled() && needs.publication-intent.result == 'success' && (needs.publication-intent.outputs.publish != 'true' || needs.release-configuration.result == 'success') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      publish: ${{ steps.version.outputs.publish }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}
      - id: version
        name: The tag, the version and the dist-tag
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          SHOULD_PUBLISH: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish }}
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/core/package.json)
          for file in package.json packages/*/package.json apps/*/package.json; do
            test "$(jq -r .version "$file")" = "$version" || { echo "::error::$file is not at $version"; exit 1; }
          done
          publish=false
          if [ -n "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v$version" || { echo "::error::tag is not v$version"; exit 1; }
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" \
              || { echo "::error::checkout is not the release tag"; exit 1; }
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "::error::tag is not a commit of main"; exit 1; }
            if [ "$SHOULD_PUBLISH" = true ]; then publish=true; fi
          elif [ "$SHOULD_PUBLISH" = true ]; then
            echo "::error::Publishing requires an existing version tag."
            exit 1
          fi
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          echo "Version $version, dist-tag $dist_tag, publish $publish."
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun packages/agent-runtime/build.ts
      - run: bun scripts/validate-runtime-native.ts
      - run: bun run typecheck
      - run: bun test --reporter=junit --reporter-outfile=/tmp/release-tests.xml
        env:
          CODEX_NATIVE_TEST_BINARY: ${{ github.workspace }}/packages/agent-runtime/dist/codex
      - name: Require native release contracts to execute
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          report = ET.parse("/tmp/release-tests.xml").getroot()
          for name in [
              "actual runtime artifact accepts private bootstrap and scoped RPC, checkpoints and reopens journal",
              "real Codex app-server reports the selected thread cwd",
              "real Codex SAME process and thread resumes with rotated MCP credentials without model inference",
          ]:
              selected = [case for case in report.iter("testcase") if case.get("name") == name]
              assert len(selected) == 1 and all(selected[0].find(tag) is None for tag in ["failure", "error", "skipped"]), f"Native contract did not execute exactly once without skips: {name}"
          PYTHON
      - name: Real checkpoint process boundary
        run: |
          sudo unshare --pid --fork --mount-proc "$(which bun)" packages/provider-modal/test/checkpoint-process-conformance.ts
          sudo unshare --pid --fork --mount-proc "$(which bun)" packages/provider-modal/test/checkpoint-process-conformance.ts --native-pidfds

  sandbox-image:
    name: Publish official sandbox image (linux/amd64)
    outputs:
      enabled: ${{ steps.foundation.outputs.enabled }}
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - id: foundation
        name: Preserve recovery of releases predating the official image
        run: |
          if [ -f images/sandbox/Dockerfile ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish versioned image and record immutable pin
        if: steps.foundation.outputs.enabled == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          registry=ghcr.io/the-vibe-company/armada-sandbox
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          # A recovery run must reuse an existing version, not replace its bytes.
          digest=$(python3 scripts/release/sandbox-image-digest.py)
          if [ -z "$digest" ]; then
            docker buildx build --platform linux/amd64 --file images/sandbox/Dockerfile \
              --tag "$registry:$VERSION" --push --metadata-file /tmp/sandbox-metadata.json .
            digest=$(jq -er '."containerimage.digest"' /tmp/sandbox-metadata.json)
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n --arg version "$VERSION" --arg image "$registry@$digest" \
            '{version: $version, image: $image}' > packages/core/src/official-sandbox-image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.foundation.outputs.enabled == 'true'
        with:
          name: official-sandbox-image
          path: packages/core/src/official-sandbox-image.json
          if-no-files-found: error
          overwrite: true

  # As in CI, each binary is compiled and run on its own platform (macOS signs it ad hoc there).
  binary:
    name: Binary (${{ matrix.target }})
    needs: [check, sandbox-image]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.sandbox-image.result == 'success' || needs.check.outputs.publish != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.sandbox-image.outputs.enabled == 'true'
        with:
          name: official-sandbox-image
          path: packages/core/src
      - run: bun run build --target ${{ matrix.target }}
      - name: npm pack and install
        run: |
          bun scripts/npm.ts --binaries dist --target ${{ matrix.target }}
          mkdir -p dist/tarballs
          for dir in dist/npm/*/; do (cd "$dir" && npm pack --pack-destination ../../tarballs); done
          scripts/npm-smoke.sh dist/tarballs ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: armada-${{ matrix.target }}
          path: |
            dist/armada-${{ matrix.target }}
            dist/armada-server-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true

  staging-smoke:
    permissions:
      contents: read
      actions: read
    name: Smoke exact release commit on staging
    needs: [check, binary, sandbox-image]
    if: ${{ !cancelled() && needs.check.outputs.publish == 'true' && needs.check.result == 'success' && needs.binary.result == 'success' }}
    uses: ./.github/workflows/staging-gated-production.yml
    with:
      source_sha: ${{ needs.check.outputs.sha }}
      official_image: ${{ needs.sandbox-image.outputs.enabled == 'true' }}
    secrets: inherit

  production:
    name: Release migrations, server and dashboard
    permissions:
      contents: read
      actions: read
    needs: [check, binary, staging-smoke]
    if: ${{ !cancelled() && needs.check.outputs.publish == 'true' && needs.check.result == 'success' && needs.binary.result == 'success' && needs.staging-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: production-supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ARMADA_SERVER_URL: ${{ secrets.ARMADA_SERVER_URL }}
      RELEASE_SHA: ${{ needs.check.outputs.sha }}
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Recheck production configuration before any mutation
        env:
          RELEASE_ENVIRONMENT: production
        run: |
          set -euo pipefail
          case "$RELEASE_ENVIRONMENT" in staging|production) ;; *) echo "::error::Unsupported release configuration environment."; exit 1 ;; esac
          required=(SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
            RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID
            VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID ARMADA_SERVER_URL)
          if [[ "$RELEASE_ENVIRONMENT" == staging ]]; then
            required+=(ARMADA_SMOKE_TOKEN ARMADA_SMOKE_CASES ARMADA_ORIGIN)
          fi
          missing=()
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing release configuration ($RELEASE_ENVIRONMENT): ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: hashFiles('images/sandbox/Dockerfile') != ''
        with:
          name: official-sandbox-image
          path: packages/core/src
      - name: Reject superseded releases
        run: |
          # Recovery retries the latest stable release, never silently downgrades production.
          latest=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p')
          test "v$RELEASE_VERSION" = "$latest" || {
            echo "::error::Production deploy requires the latest stable tag ($latest); use a new hotfix release."
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.75.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned deployment clients
        run: npm install --global @railway/cli@5.71.0 vercel@65.14.0
      - uses: ./.github/actions/setup-bun
      - name: Migrate, deploy server, wait healthy, then deploy prebuilt dashboard
        run: bash .release-tools/scripts/release/deploy-production.sh
      - name: Report stopped release
        if: failure()
        run: echo "::error::Release stopped; do not deploy later stages manually. See docs/releasing.md for partial-release recovery."

  publish:
    name: Publish to npm
    needs: [check, binary, production]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.binary.result == 'success' && (needs.production.result == 'success' || (needs.production.result == 'skipped' && needs.check.outputs.publish != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DIST_TAG: ${{ needs.check.outputs.dist_tag }}
      PUBLISH: ${{ needs.check.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      # Recovery may target a release tag that predates the registry guard.
      # Load publication tooling from this workflow's revision, keeping artifacts on the release tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts/publish-npm.sh
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-bun
      # npm 11 supports Trusted Publishing. CI never needs a long-lived npm token.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: armada-*
          path: dist
          merge-multiple: true
      - name: Stage and pack every package
        run: |
          set -euo pipefail
          bun scripts/npm.ts --binaries dist
          mkdir -p dist/tarballs
          for dir in dist/npm/*/; do (cd "$dir" && npm pack --pack-destination ../../tarballs); done
          sha256sum dist/tarballs/*.tgz > dist/tarballs/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarballs-${{ needs.check.outputs.version }}
          path: dist/tarballs
          if-no-files-found: error
          overwrite: true
      - name: Install the tarballs that are published
        run: scripts/npm-smoke.sh dist/tarballs linux-x64
      - name: npm publish
        run: bash .release-tools/scripts/publish-npm.sh
