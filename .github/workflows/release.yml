name: Release

# Release Please prepares version PRs. Stable publication follows exact-source smoke.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to recover (leave both inputs empty for a dry run)"
        type: string
        default: ""
      sha:
        description: "Full main commit SHA to recover"
        type: string
        default: ""

permissions:
  contents: read

# Reserve staging through publication, production and npm. Ordinary staging
# shares this lock; pinned child smoke must use its separate lock.
concurrency:
  group: release-production
  queue: max
  cancel-in-progress: false

jobs:
  publication-intent:
    name: Decide publication intent without deployment credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.intent.outputs.publish }}
      mode: ${{ steps.intent.outputs.mode }}
      version: ${{ steps.intent.outputs.version }}
      sha: ${{ steps.intent.outputs.sha }}
    steps:
      - name: Require main for publication or recovery
        if: github.ref != 'refs/heads/main' && (inputs.version != '' || inputs.sha != '')
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Decide publication intent
        id: intent
        env:
          RUN_MODE: ${{ github.event_name == 'push' && 'automatic' || ((inputs.version != '' || inputs.sha != '') && 'dispatch' || 'dry-run') }}
          SOURCE_SHA: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/release/publication.ts admit

  release-configuration:
    name: Check ${{ matrix.environment }} release configuration
    needs: publication-intent
    if: needs.publication-intent.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ matrix.environment }}
    steps:
      - name: Require release configuration before any publication
        env:
          RELEASE_ENVIRONMENT: ${{ matrix.environment }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ARMADA_SERVER_URL: ${{ secrets.ARMADA_SERVER_URL }}
          ARMADA_SMOKE_TOKEN: ${{ matrix.environment == 'staging' && secrets.ARMADA_SMOKE_TOKEN || '' }}
          ARMADA_SMOKE_CASES: ${{ matrix.environment == 'staging' && secrets.ARMADA_SMOKE_CASES || '' }}
          ARMADA_ORIGIN: ${{ matrix.environment == 'staging' && vars.ARMADA_ORIGIN || '' }}
        run: |
          set -euo pipefail
          case "$RELEASE_ENVIRONMENT" in staging|production) ;; *) echo "::error::Unsupported release configuration environment."; exit 1 ;; esac
          required=(SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
            RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID
            VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID ARMADA_SERVER_URL)
          if [[ "$RELEASE_ENVIRONMENT" == staging ]]; then
            required+=(ARMADA_SMOKE_TOKEN ARMADA_SMOKE_CASES ARMADA_ORIGIN)
          fi
          missing=()
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing release configuration ($RELEASE_ENVIRONMENT): ${missing[*]}"
            exit 1
          fi

  release-please:
    name: Prepare the next version PR
    needs: publication-intent
    if: needs.publication-intent.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # Explicitly dispatch CI for bot-authored release PRs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Reconcile the published version PR
        env:
          VERSION: ${{ needs.publication-intent.outputs.version }}
          RELEASE_SHA: ${{ needs.publication-intent.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/release/publication.ts reconcile
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          skip-github-release: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
      - uses: ./.github/actions/setup-bun
        if: steps.release.outputs.prs_created == 'true'
      - name: Sync Bun's workspace versions and run release PR checks
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          bun install --lockfile-only --ignore-scripts
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m "chore(release): synchronize Bun workspace versions"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
          # Neither PR creation nor this bot push triggers pull_request/push CI.
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"

  release-metadata:
    name: Validate the release version and source SHA
    needs: [publication-intent, release-configuration]
    if: ${{ !cancelled() && needs.publication-intent.result == 'success' && (needs.publication-intent.outputs.mode == 'dry-run' || (needs.publication-intent.outputs.publish == 'true' && needs.release-configuration.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      check-run: ${{ steps.receipts.outputs.check }}
      binary-run: ${{ steps.artifacts.outputs.run }}
      staging-digest: ${{ steps.receipts.outputs.staging-digest }}
      production-run: ${{ steps.receipts.outputs.production }}
      npm-run: ${{ steps.receipts.outputs.npm }}
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      publish: ${{ steps.version.outputs.publish }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.publication-intent.outputs.sha }}
      - id: version
        name: Validate workspace versions and set the dist-tag
        env:
          EXPECTED_VERSION: ${{ needs.publication-intent.outputs.version }}
          PUBLISH: ${{ needs.publication-intent.outputs.publish }}
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/core/package.json)
          for file in package.json packages/*/package.json apps/*/package.json; do
            test "$(jq -r .version "$file")" = "$version" || { echo "::error::$file is not at $version"; exit 1; }
          done
          [[ -z "$EXPECTED_VERSION" || "$version" == "$EXPECTED_VERSION" ]]
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          echo "Version $version, dist-tag $dist_tag, publish $PUBLISH."
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.version.outputs.publish == 'true'
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/release
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        if: steps.version.outputs.publish == 'true'
      - name: Read exact-source release stage receipts
        id: receipts
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/status?per_page=100" \
            | jq -e --arg sha "$RELEASE_SHA" '
                if length > 0 and all(.[]; .sha == $sha)
                then {sha: $sha, statuses: [.[].statuses[]]}
                else error("Release status response did not match source SHA") end' \
            | bun .release-tools/scripts/release/stage-skip.ts receipts
      - name: Check reusable binary artifacts
        id: artifacts
        if: steps.receipts.outputs.binaries != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BINARY_RUN: ${{ steps.receipts.outputs.binaries }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BINARY_RUN/artifacts?per_page=100")
          required=()
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            required+=("armada-$target" "npm-tarballs-$VERSION-$target")
          done
          if [[ -f images/sandbox/Dockerfile ]]; then required+=(official-sandbox-image); fi
          for name in "${required[@]}"; do
            if ! jq -e --arg name "$name" 'any(.artifacts[]; .name == $name and .expired == false)' <<< "$artifacts" >/dev/null; then
              echo "::notice::Binary receipt artifacts are unavailable; rebuilding binaries."
              exit 0
            fi
          done
          echo "::notice::Skipping release/binaries using artifacts from run $BINARY_RUN."
          echo "run=$BINARY_RUN" >> "$GITHUB_OUTPUT"

  check:
    name: Check the release contracts
    needs: release-metadata
    if: needs.release-metadata.outputs.check-run == ''
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: release_fixture
          POSTGRES_DB: armada_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-metadata.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ">=22.18.0 <23"
      - run: bun run lint
      - run: bun packages/agent-runtime/build.ts
      - run: bun scripts/validate-runtime-native.ts
      - run: bun run typecheck
      - run: >-
          bun test
          ./packages/core/test/database-types.probe.ts
          ./packages/core/test/private-skill.probe.ts
          ./packages/core/test/golden-scan.probe.ts
          ./packages/core/test/work-preservation.probe.ts
          ./packages/provider-boat/test/native-cwd.test.ts
          --reporter=junit --reporter-outfile=/tmp/release-native-tests.xml
      - name: Migrate disposable release contract database
        env:
          PGURL: postgres://postgres:release_fixture@127.0.0.1:5432/armada_contracts
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/db/supabase-prereq.sql
          for migration in supabase/migrations/*.sql; do
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Require PostgreSQL, packaging and native release contracts without skips
        env:
          ARMADA_TEST_POSTGRES_URL: postgres://postgres:release_fixture@127.0.0.1:5432/armada_contracts
          CODEX_NATIVE_TEST_BINARY: ${{ github.workspace }}/packages/agent-runtime/dist/codex
        run: python3 scripts/validate-release-contracts.py
      - name: Require retained core probes and native unit sentinels to execute
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("/tmp/release-native-tests.xml").iter("testcase"))
          for name in [
              "generated types match the migrations",
              "private installer ok",
              "real shell: a clean sandbox passes",
              "local capture recovers commits and staged, unstaged and untracked work without GitHub authorization",
              "Codex wrapper enforces Boat's thread/turn protocol cwd, not only process cwd",
          ]:
              selected = [case for case in cases if case.get("name") == name]
              assert len(selected) == 1 and all(selected[0].find(tag) is None for tag in ["failure", "error", "skipped"]), f"Native contract did not execute exactly once without skips: {name}"
          PYTHON
      - name: Real checkpoint process boundary
        run: |
          sudo unshare --pid --fork --mount-proc "$(which bun)" packages/provider-modal/test/checkpoint-process-conformance.ts
          sudo unshare --pid --fork --mount-proc "$(which bun)" packages/provider-modal/test/checkpoint-process-conformance.ts --native-pidfds

      - name: Record release/check success
        if: needs.release-metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-metadata.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" -f state=success \
            -f context=release/check -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  sandbox-image:
    name: Build candidate sandbox image (linux/amd64)
    outputs:
      enabled: ${{ steps.foundation.outputs.enabled }}
      digest: ${{ steps.image.outputs.digest }}
      staged: ${{ steps.staging-receipt.outputs.staged }}
      sha: ${{ needs.release-metadata.outputs.sha }}
      publish: ${{ needs.release-metadata.outputs.publish }}
    needs: [release-metadata, publication-intent]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.release-metadata.outputs.publish == 'true'
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}
          persist-credentials: false
      - id: foundation
        name: Decide whether this run needs an official image pin
        env:
          PUBLISH: ${{ needs.release-metadata.outputs.publish }}
        run: |
          if [ "$PUBLISH" = true ] && [ -f images/sandbox/Dockerfile ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.foundation.outputs.enabled == 'true'
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/release
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.foundation.outputs.enabled == 'true' && needs.release-metadata.outputs.binary-run != ''
        with:
          name: official-sandbox-image
          path: packages/core/src
          github-token: ${{ github.token }}
          run-id: ${{ needs.release-metadata.outputs.binary-run }}
      - id: image
        name: Record the immutable candidate or published digest
        if: steps.foundation.outputs.enabled == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          SHA: ${{ needs.release-metadata.outputs.sha }}
          MODE: ${{ needs.publication-intent.outputs.mode }}
          BINARY_RUN: ${{ needs.release-metadata.outputs.binary-run }}
        run: |
          set -euo pipefail
          registry=ghcr.io/the-vibe-company/armada-sandbox
          candidate="$VERSION-rc.$SHA"
          if [[ -n "$BINARY_RUN" ]]; then
            pin=$(jq -er --arg version "$VERSION" 'select(.version == $version) | .image' packages/core/src/official-sandbox-image.json)
            [[ "$pin" == "$registry"@* ]]
            digest="${pin#*@}"
          elif [[ "$MODE" == recover ]]; then
            digest=$(IMAGE_TAG="$VERSION" python3 .release-tools/scripts/release/sandbox-image-digest.py)
          else
            digest=$(IMAGE_TAG="$candidate" python3 .release-tools/scripts/release/sandbox-image-digest.py)
          fi
          if [[ "$MODE" != recover && -z "$BINARY_RUN" && -z "$digest" ]]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            trap 'docker logout ghcr.io' EXIT
            docker buildx build --platform linux/amd64 --file images/sandbox/Dockerfile \
              --tag "$registry:$candidate" --push --metadata-file /tmp/sandbox-metadata.json .
            digest=$(jq -er '."containerimage.digest"' /tmp/sandbox-metadata.json)
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          jq -n --arg version "$VERSION" --arg image "$registry@$digest" \
            '{version: $version, image: $image}' > packages/core/src/official-sandbox-image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.foundation.outputs.enabled == 'true'
        with:
          name: official-sandbox-image
          path: packages/core/src/official-sandbox-image.json
          if-no-files-found: error
          overwrite: true

      - name: Check staging receipt against this run's image
        id: staging-receipt
        env:
          RECORDED_DIGEST: ${{ needs.release-metadata.outputs.staging-digest }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [[ "$RECORDED_DIGEST" == "${IMAGE_DIGEST:-none}" ]]; then
            echo "::notice::Skipping release/staging-smoke using the recorded success for this source and image."
            echo "staged=true" >> "$GITHUB_OUTPUT"
          fi

  # As in CI, each binary is compiled and run on its own platform (macOS signs it ad hoc there).
  binary:
    name: Binary (${{ matrix.target }})
    needs: [release-metadata, sandbox-image]
    if: needs.release-metadata.outputs.binary-run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.sandbox-image.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.sandbox-image.outputs.enabled == 'true'
        with:
          name: official-sandbox-image
          path: packages/core/src
      - run: bun run build --target ${{ matrix.target }}
      - name: npm pack and install
        run: |
          bun scripts/npm.ts --binaries dist --target ${{ matrix.target }}
          mkdir -p dist/tarballs
          for dir in dist/npm/*/; do (cd "$dir" && npm pack --pack-destination ../../tarballs); done
          scripts/npm-smoke.sh dist/tarballs ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: armada-${{ matrix.target }}
          path: |
            dist/armada-${{ matrix.target }}
            dist/armada-server-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true

      - name: Collect smoke-tested npm tarballs
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/npm-artifact
          mv "dist/tarballs/the-vibe-company-armada-$TARGET-$VERSION.tgz" dist/npm-artifact/
          if [[ "$TARGET" == linux-x64 ]]; then
            mv dist/tarballs/the-vibe-company-armada{,-sdk}-"$VERSION".tgz dist/npm-artifact/
          fi
          cd dist/npm-artifact
          shasum -a 256 -- *.tgz > "SHA256SUMS-$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarballs-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}
          path: dist/npm-artifact
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  record-binaries:
    name: Record the complete binary matrix
    needs: [release-metadata, binary]
    if: needs.release-metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Record release/binaries success
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-metadata.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" -f state=success \
            -f context=release/binaries -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  staging-smoke:
    # The reusable job declares these scopes and records pinned smoke separately.
    permissions:
      contents: read
      actions: read
      issues: write
      statuses: write
    name: Smoke exact release commit on staging
    needs: sandbox-image
    if: needs.sandbox-image.outputs.publish == 'true' && needs.sandbox-image.outputs.staged != 'true'
    uses: ./.github/workflows/staging-gated-production.yml
    with:
      source_sha: ${{ needs.sandbox-image.outputs.sha }}
      official_image: ${{ needs.sandbox-image.outputs.enabled == 'true' }}
      image_digest: ${{ needs.sandbox-image.outputs.digest }}
    secrets: inherit

  finalize-release:
    name: Publish the smoked image, tag and GitHub release
    needs: [release-metadata, check, sandbox-image, record-binaries, staging-smoke]
    if: >-
      !cancelled() && needs.release-metadata.outputs.publish == 'true' &&
      needs.sandbox-image.result == 'success' &&
      (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.release-metadata.outputs.check-run != '')) &&
      (needs.record-binaries.result == 'success' || (needs.record-binaries.result == 'skipped' && needs.release-metadata.outputs.binary-run != '')) &&
      (needs.staging-smoke.result == 'success' || (needs.staging-smoke.result == 'skipped' && needs.sandbox-image.outputs.staged == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: read
      packages: write
    env:
      VERSION: ${{ needs.release-metadata.outputs.version }}
      RELEASE_SHA: ${{ needs.release-metadata.outputs.sha }}
      SMOKED_DIGEST: ${{ needs.sandbox-image.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Verify source and plan publication
        id: plan
        run: |
          set -euo pipefail
          export STABLE_DIGEST=""
          if [[ -n "$SMOKED_DIGEST" ]]; then
            STABLE_DIGEST=$(IMAGE_TAG="$VERSION" python3 scripts/release/sandbox-image-digest.py)
          fi
          bun scripts/release/publication.ts finalize
      - name: Promote and verify the smoked digest
        if: steps.plan.outputs.promote == 'true'
        run: |
          set -euo pipefail
          registry=ghcr.io/the-vibe-company/armada-sandbox
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker buildx imagetools create --prefer-index=false -t "$registry:$VERSION" "$registry@$SMOKED_DIGEST"
          test "$(IMAGE_TAG="$VERSION" python3 scripts/release/sandbox-image-digest.py)" = "$SMOKED_DIGEST"
      - name: Create the release on the smoked SHA
        if: steps.plan.outputs.create == 'true'
        run: |
          gh release create "v$VERSION" --target "$RELEASE_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the published tag and reconcile the version PR
        run: bun scripts/release/publication.ts reconcile

  production:
    name: Release migrations, server and dashboard
    permissions:
      contents: read
      actions: read
      statuses: write
    needs: [release-metadata, finalize-release]
    if: needs.release-metadata.outputs.publish == 'true' && needs.release-metadata.outputs.production-run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: production-supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ARMADA_SERVER_URL: ${{ secrets.ARMADA_SERVER_URL }}
      RELEASE_SHA: ${{ needs.release-metadata.outputs.sha }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - name: Recheck production configuration before any mutation
        env:
          RELEASE_ENVIRONMENT: production
        run: |
          set -euo pipefail
          case "$RELEASE_ENVIRONMENT" in staging|production) ;; *) echo "::error::Unsupported release configuration environment."; exit 1 ;; esac
          required=(SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
            RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID
            VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID ARMADA_SERVER_URL)
          if [[ "$RELEASE_ENVIRONMENT" == staging ]]; then
            required+=(ARMADA_SMOKE_TOKEN ARMADA_SMOKE_CASES ARMADA_ORIGIN)
          fi
          missing=()
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing release configuration ($RELEASE_ENVIRONMENT): ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: hashFiles('images/sandbox/Dockerfile') != ''
        with:
          name: official-sandbox-image
          path: packages/core/src
      - name: Reject superseded releases
        run: |
          # Recovery retries the latest stable release, never silently downgrades production.
          latest=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p')
          test "v$RELEASE_VERSION" = "$latest" &&
            test "$(git rev-parse "refs/tags/v$RELEASE_VERSION^{commit}")" = "$RELEASE_SHA" || {
            echo "::error::Production deploy requires the latest stable tag ($latest); use a new hotfix release."
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.75.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned deployment clients
        run: npm install --global @railway/cli@5.71.0 vercel@65.14.0
      - uses: ./.github/actions/setup-bun
      - name: Migrate, deploy server, wait healthy, then deploy prebuilt dashboard
        env:
          RELEASE_ENVIRONMENT: production
          RELEASE_RESUME: 'true'
        run: bash .release-tools/scripts/release/deploy-production.sh
      - name: Record release/production success
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-metadata.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" -f state=success \
            -f context=release/production -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Report stopped release
        if: failure()
        run: echo "::error::Release stopped; do not deploy later stages manually. See docs/releasing.md for partial-release recovery."

  publish:
    name: Publish to npm
    needs: [release-metadata, check, binary, finalize-release, production]
    if: >-
      !cancelled() && needs.release-metadata.result == 'success' && needs.release-metadata.outputs.npm-run == '' &&
      ((needs.finalize-release.result == 'success' &&
        (needs.production.result == 'success' || (needs.production.result == 'skipped' && needs.release-metadata.outputs.production-run != ''))) ||
       (needs.release-metadata.outputs.publish != 'true' && needs.check.result == 'success' && needs.binary.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      actions: read
      statuses: write
      id-token: write # npm Trusted Publishing and provenance
    env:
      VERSION: ${{ needs.release-metadata.outputs.version }}
      DIST_TAG: ${{ needs.release-metadata.outputs.dist_tag }}
      PUBLISH: ${{ needs.release-metadata.outputs.publish }}
    steps:
      # Load publication tooling from this workflow's revision, including on tag recovery.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts/publish-npm.sh
          sparse-checkout-cone-mode: false
      # npm 11 supports Trusted Publishing. CI never needs a long-lived npm token.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.release-metadata.outputs.binary-run || github.run_id }}
          pattern: npm-tarballs-${{ needs.release-metadata.outputs.version }}-*
          path: dist/tarballs
          merge-multiple: true
      - name: Verify and publish the smoke-tested tarballs
        id: verified-npm-publish
        run: |
          set -euo pipefail
          cd dist/tarballs
          prefix=the-vibe-company-armada
          main="$prefix-$VERSION.tgz"
          sdk="$prefix-sdk-$VERSION.tgz"
          platforms=("$prefix"-{darwin-arm64,darwin-x64,linux-arm64,linux-x64}-"$VERSION.tgz")
          cat SHA256SUMS-{darwin-arm64,darwin-x64,linux-arm64,linux-x64} > SHA256SUMS
          # Check the complete expected set, even if an artifact omitted both a tarball and its entry.
          shasum -a 256 -- "$main" "$sdk" "${platforms[@]}" > SHA256SUMS.actual
          LC_ALL=C sort SHA256SUMS.actual | diff -u <(LC_ALL=C sort SHA256SUMS) -
          bash ../../.release-tools/scripts/publish-npm.sh "$main" "$sdk" "${platforms[@]}"

      - name: Record release/npm success
        if: needs.release-metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-metadata.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" -f state=success \
            -f context=release/npm -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
