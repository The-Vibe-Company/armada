name: Release

# Release Please opens the version PR on main. Merging it creates the release tag and
# publishes in this same workflow: GITHUB_TOKEN-created tags do not trigger tag workflows.
# Tag pushes also work; manual runs are dry runs unless a tag and publish=true are supplied.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<version> tag (empty: dry-run the selected ref)"
        type: string
        default: ""
      publish:
        description: "Publish/recover the existing tag instead of a dry run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare the version PR or GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # Explicitly dispatch CI for bot-authored release PRs.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - uses: ./.github/actions/setup-bun
        if: steps.release.outputs.prs_created == 'true'
      - name: Sync Bun's workspace versions and run release PR checks
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          bun install --lockfile-only --ignore-scripts
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m "chore(release): synchronize Bun workspace versions"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
          # Neither PR creation nor this bot push triggers pull_request/push CI.
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"

  check:
    name: Check the version and the tests
    needs: release-please
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      publish: ${{ steps.version.outputs.publish }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}
      - id: version
        name: The tag, the version and the dist-tag
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          SHOULD_PUBLISH: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish }}
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/core/package.json)
          for file in package.json packages/*/package.json apps/*/package.json; do
            test "$(jq -r .version "$file")" = "$version" || { echo "::error::$file is not at $version"; exit 1; }
          done
          publish=false
          if [ -n "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v$version" || { echo "::error::tag is not v$version"; exit 1; }
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" \
              || { echo "::error::checkout is not the release tag"; exit 1; }
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "::error::tag is not a commit of main"; exit 1; }
            if [ "$SHOULD_PUBLISH" = true ]; then publish=true; fi
          elif [ "$SHOULD_PUBLISH" = true ]; then
            echo "::error::Publishing requires an existing version tag."
            exit 1
          fi
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          echo "Version $version, dist-tag $dist_tag, publish $publish."
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  # As in CI, each binary is compiled and run on its own platform (macOS signs it ad hoc there).
  binary:
    name: Binary (${{ matrix.target }})
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run build --target ${{ matrix.target }}
      - name: npm pack and install
        run: |
          bun scripts/npm.ts --binaries dist --target ${{ matrix.target }}
          mkdir -p dist/tarballs
          for dir in dist/npm/*/; do (cd "$dir" && npm pack --pack-destination ../../tarballs); done
          scripts/npm-smoke.sh dist/tarballs ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: armada-${{ matrix.target }}
          path: dist/armada-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish to npm
    needs: [check, binary]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DIST_TAG: ${{ needs.check.outputs.dist_tag }}
      PUBLISH: ${{ needs.check.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      # npm 11 supports Trusted Publishing. CI never needs a long-lived npm token.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: armada-*
          path: dist
          merge-multiple: true
      - name: Stage and pack every package
        run: |
          set -euo pipefail
          bun scripts/npm.ts --binaries dist
          mkdir -p dist/tarballs
          for dir in dist/npm/*/; do (cd "$dir" && npm pack --pack-destination ../../tarballs); done
          sha256sum dist/tarballs/*.tgz > dist/tarballs/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarballs-${{ needs.check.outputs.version }}
          path: dist/tarballs
          if-no-files-found: error
          overwrite: true
      - name: Install the tarballs that are published
        run: scripts/npm-smoke.sh dist/tarballs linux-x64
      - name: npm publish
        run: |
          set -euo pipefail
          dry=()
          if [ "$PUBLISH" != true ]; then dry=(--dry-run); fi
          # Platform packages first: the main package must never resolve to a missing binary.
          for dir in dist/npm/armada-*/ dist/npm/armada/; do
            name=$(jq -r .name "$dir/package.json")
            tarball="dist/tarballs/$(echo "${name#@}" | tr / -)-$VERSION.tgz"
            if [ "$PUBLISH" = true ] && npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published."
              continue
            fi
            npm publish "$tarball" --access public --tag "$DIST_TAG" --provenance "${dry[@]}"
          done
