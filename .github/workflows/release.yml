name: Release

# Release Please prepares version PRs. Stable publication follows exact-source smoke.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to recover (leave both inputs empty for a dry run)"
        type: string
        default: ""
      sha:
        description: "Full main commit SHA to recover"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publication-intent:
    name: Decide publication intent without deployment credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.intent.outputs.publish }}
      mode: ${{ steps.intent.outputs.mode }}
      version: ${{ steps.intent.outputs.version }}
      sha: ${{ steps.intent.outputs.sha }}
    steps:
      - name: Require main for publication or recovery
        if: github.ref != 'refs/heads/main' && (inputs.version != '' || inputs.sha != '')
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Decide publication intent
        id: intent
        env:
          RUN_MODE: ${{ github.event_name == 'push' && 'automatic' || ((inputs.version != '' || inputs.sha != '') && 'dispatch' || 'dry-run') }}
          SOURCE_SHA: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/release/publication.ts admit

  release-please:
    name: Prepare the next version PR
    needs: [publication-intent, release-pipeline]
    if: >-
      !cancelled() && needs.publication-intent.result == 'success' &&
      (needs.publication-intent.outputs.mode == 'prepare' ||
       (needs.release-pipeline.result == 'success' && needs.release-pipeline.outputs.mode == 'prepare'))
    concurrency:
      group: release-version-pr
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # Explicitly dispatch CI for bot-authored release PRs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Reconcile the published version PR
        env:
          VERSION: ${{ needs.release-pipeline.outputs.version || needs.publication-intent.outputs.version }}
          RELEASE_SHA: ${{ needs.release-pipeline.outputs.sha || needs.publication-intent.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/release/publication.ts reconcile
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          skip-github-release: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
      - uses: ./.github/actions/setup-bun
        if: steps.release.outputs.prs_created == 'true'
      - name: Sync Bun's workspace versions and run release PR checks
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          bun install --lockfile-only --ignore-scripts
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m "chore(release): synchronize Bun workspace versions"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
          # Neither PR creation nor this bot push triggers pull_request/push CI.
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"

  release-pipeline:
    name: Release pipeline
    needs: publication-intent
    if: needs.publication-intent.outputs.publish == 'true' || needs.publication-intent.outputs.mode == 'dry-run'
    # Hold the same lock as ordinary staging and rollback across the entire call.
    concurrency:
      group: ${{ needs.publication-intent.outputs.publish == 'true' && 'release-production' || format('release-dry-run-{0}', github.run_id) }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: read
      statuses: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release-pipeline.yml
    with:
      mode: ${{ needs.publication-intent.outputs.mode }}
      version: ${{ needs.publication-intent.outputs.version }}
      sha: ${{ needs.publication-intent.outputs.sha }}
    secrets: inherit
