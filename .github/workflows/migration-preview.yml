name: Migration preview

on:
  pull_request:
    paths:
      - '.github/workflows/migration-preview.yml'
      - 'scripts/db/supabase-prereq.sql'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: migration-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Migration dry-run (disposable database)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.75.0
      - name: Bootstrap Supabase prerequisites
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -v ON_ERROR_STOP=1 < scripts/db/supabase-prereq.sql
      - name: Apply migrations to the disposable database
        run: supabase db push --db-url 'postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable' --yes
