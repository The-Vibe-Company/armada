name: Migration preview

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db/supabase-prereq.sql'
      - '.github/workflows/migration-preview.yml'

permissions:
  contents: read

concurrency:
  group: migration-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Migration dry-run (disposable database)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.75.0
      - name: Apply migrations with the release client on disposable Postgres
        env:
          PGSSLMODE: disable # Disposable service only.
          PGURL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/db/supabase-prereq.sql
          supabase db push --db-url "$PGURL" --yes
