name: Dashboard e2e shard

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: number

permissions:
  contents: read

jobs:
  e2e:
    name: Shard ${{ inputs.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Use the image for pre-baked Noble system libraries, not its bundled browsers.
    # Install the lockfile-selected Chromium below so browser/package revisions match.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The container has Node/npm, but not jq (used by setup-bun's fallback).
      - name: Install pinned Bun
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install --global --prefix "$HOME/.bun-npm" "bun@$version"
          echo "$HOME/.bun-npm/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install chromium
        working-directory: apps/dashboard
      # Each job owns its mock, production build and fixed ports. Never share the mock across workers.
      - run: bun run e2e --shard=${{ inputs.shard }}/3 --workers=1 --retries=0
        working-directory: apps/dashboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: dashboard-e2e-results-${{ inputs.shard }}
          path: apps/dashboard/test-results
          if-no-files-found: ignore

