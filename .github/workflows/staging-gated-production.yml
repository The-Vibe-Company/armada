name: Pinned staging smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Validated release commit from Release
        required: true
        type: string

      release_gate:
        description: Publishing release requires a full unthrottled smoke
        type: boolean
        default: false

      official_image:
        description: Consume the official image pin from the calling release
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Coalesce ordinary main work: preserve the active workflow and keep only the
# latest pending main. Release calls use separate outer groups and the FIFO job
# lock below, so replacing a queued main can never evict a release smoke.
concurrency:
  group: ${{ inputs.release_gate && format('staging-release-{0}', github.run_id) || 'staging-main-latest' }}
  cancel-in-progress: false

jobs:
  configuration:
    outputs:
      smoke: ${{ steps.admission.outputs.run }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment source
        env:
          SOURCE_REF: ${{ github.ref }}
          RELEASE_CALL_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/main && "$SOURCE_REF" != refs/tags/v* ]]; then
            echo "::error::Pinned staging deployment requires main or a validated release call."
            exit 1
          fi
          if [[ "$SOURCE_REF" == refs/tags/v* && -z "$RELEASE_CALL_SHA" ]]; then
            echo "::error::Tag staging deployment requires the validated release SHA."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Admit full staging smoke interval
        id: admission
        env:
          SMOKE_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGING_SMOKE_INTERVAL_MINUTES: ${{ vars.STAGING_SMOKE_INTERVAL_MINUTES || '30' }}
          SMOKE_RELEASE_GATE: ${{ inputs.release_gate && 'true' || 'false' }}
        run: bun scripts/staging-smoke-admission.ts

  staging:
    needs: configuration
    if: (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && inputs.source_sha != '')) && (github.event_name != 'schedule' || needs.configuration.outputs.smoke == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment: staging
    concurrency:
      group: post-deploy-smoke-staging
      queue: max
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DEPLOYMENT_ENVIRONMENT: staging
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ARMADA_SERVER_URL: ${{ secrets.ARMADA_SERVER_URL }}
      RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
      STAGING_LATEST_ONLY: ${{ inputs.release_gate && 'false' || 'true' }}
      ARMADA_URL: ${{ vars.ARMADA_ORIGIN }}
      ARMADA_TOKEN: ${{ secrets.ARMADA_SMOKE_TOKEN }}
      ARMADA_SMOKE_CASES: ${{ secrets.ARMADA_SMOKE_CASES }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.official_image == true
        with:
          name: official-sandbox-image
          path: packages/core/src
      - name: Validate configuration before any mutation
        run: |
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID ARMADA_SERVER_URL ARMADA_URL ARMADA_TOKEN ARMADA_SMOKE_CASES; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing staging configuration: $key; production blocked."; exit 1; }
          done
          if [[ -n "$RAILWAY_TOKEN" ]]; then
            for key in RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID; do
              [[ -n "${!key:-}" ]] || { echo "::error::Missing staging configuration: $key"; exit 1; }
            done
          fi
          [[ "${ARMADA_URL%/}" == "${ARMADA_SERVER_URL%/}" ]] || {
            echo "::error::Smoke origin must match the deployed staging server; production blocked."
            exit 1
          }
          echo "RELEASE_VERSION=$(jq -r .version packages/core/package.json)" >> "$GITHUB_ENV"
      # Match production: deploy tooling comes from the executing workflow,
      # while git archive and all application sources stay on RELEASE_SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.75.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned deployment clients
        run: npm install --global @railway/cli@5.71.0 vercel@65.14.0
      - uses: ./.github/actions/setup-bun
      - name: Migrate then deploy pinned server and dashboard
        id: deployment
        run: bash .release-tools/scripts/release/deploy-production.sh
      - run: bun install --frozen-lockfile
        if: steps.deployment.outputs.superseded != 'true'
      - name: Reserve full smoke attempt before compute
        if: steps.deployment.outputs.superseded != 'true' && needs.configuration.outputs.smoke == 'true' && !inputs.release_gate
        run: printf 'reserved\n' > "$RUNNER_TEMP/staging-full-smoke-slot.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.deployment.outputs.superseded != 'true' && needs.configuration.outputs.smoke == 'true' && !inputs.release_gate
        with:
          name: staging-full-smoke-slot
          path: ${{ runner.temp }}/staging-full-smoke-slot.txt
          retention-days: 2
      - name: Restore staging smoke receipts across branches and tags
        if: steps.deployment.outputs.superseded != 'true' && needs.configuration.outputs.smoke == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .smoke
          gh api "repos/$GH_REPO/actions/artifacts?name=armada-staging-smoke-journal&per_page=100" > "$RUNNER_TEMP/smoke-artifacts.json"
          jq '[.artifacts[] | select(
            .workflow_run.head_repository_id == .workflow_run.repository_id and
            (.workflow_run.head_branch == "main" or (.workflow_run.head_branch | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9.-]+)?$"))))] | {artifacts: .}' \
            "$RUNNER_TEMP/smoke-artifacts.json" > "$RUNNER_TEMP/smoke-candidates.json"
          artifact=$(jq -r '.artifacts[0].id // empty' "$RUNNER_TEMP/smoke-candidates.json")
          if [[ -n "$artifact" ]]; then
            run=$(jq -r '.artifacts[0].workflow_run.id' "$RUNNER_TEMP/smoke-candidates.json")
            # Artifacts from arbitrary PR workflows must never authorize deletion.
            gh api "repos/$GH_REPO/actions/runs/$run" | jq -e --arg repo "$GH_REPO" '
              .head_repository.full_name == $repo and
              (.event == "push" or .event == "schedule" or .event == "workflow_dispatch" or .event == "deployment_status") and
              (.head_branch == "main" or (.head_branch | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9.-]+)?$"))) and
              (.path == ".github/workflows/post-deploy-smoke.yml" or
               .path == ".github/workflows/staging-gated-production.yml" or
               .path == ".github/workflows/release.yml")' > /dev/null
            gh api "repos/$GH_REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/smoke-journal.zip"
            unzip -p "$RUNNER_TEMP/smoke-journal.zip" sandboxes.json > .smoke/sandboxes.json
          fi
      - name: Smoke pinned staging
        if: steps.deployment.outputs.superseded != 'true' && needs.configuration.outputs.smoke == 'true'
        env:
          ARMADA_SMOKE_REQUIRE_FULL: ${{ inputs.release_gate && 'true' || 'false' }}
          ARMADA_SMOKE: create_real_compute
          ARMADA_SMOKE_JOURNAL: .smoke/sandboxes.json
        run: |
          # Read probes receive only the existing staging bearer, never deployment secrets.
          env -i PATH="$PATH" HOME="$HOME" ARMADA_URL="$ARMADA_URL" ARMADA_TOKEN="$ARMADA_TOKEN" \
            ARMADA_SMOKE_CASES="$ARMADA_SMOKE_CASES" bun scripts/dashboard-read-smoke.ts &
          dashboard_pid=$!
          status=0
          env -i PATH="$PATH" HOME="$HOME" ARMADA_URL="$ARMADA_URL" ARMADA_TOKEN="$ARMADA_TOKEN" \
            ARMADA_SMOKE_CASES="$ARMADA_SMOKE_CASES" ARMADA_SMOKE="$ARMADA_SMOKE" ARMADA_SMOKE_REQUIRE_FULL="$ARMADA_SMOKE_REQUIRE_FULL" ARMADA_SMOKE_JOURNAL="$ARMADA_SMOKE_JOURNAL" \
            bun scripts/post-deploy-smoke.ts --work-preservation --templates-skills --lifecycle --vault --default-skills --scoped-access --github-refresh --golden-runtime --expiry || status=$?
          wait "$dashboard_pid" || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('.smoke/sandboxes.json') != ''
        with:
          name: armada-staging-smoke-journal
          path: .smoke/sandboxes.json
          include-hidden-files: true
          retention-days: 30
      - name: Report blocked production
        if: failure()
        run: echo "::error::Staging deployment or smoke failed; production migrations and deployments are blocked."
