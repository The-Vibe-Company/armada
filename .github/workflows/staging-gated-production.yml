name: Pinned staging smoke

on:
  # Main pushes already start Release. Its completion is the sole automatic wakeup.
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_call:
    inputs:
      source_sha:
        description: Validated release commit from Release
        required: true
        type: string

      official_image:
        description: Consume the official image pin from the calling release
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Preserve active main work, but retain only the newest pending ordinary main.
# Release completion wakes newest main; the shared lock is the only admission authority.
# Pinned calls avoid reacquiring the parent release reservation.
concurrency:
  group: ${{ inputs.source_sha != '' && format('staging-pinned-{0}', github.run_id) || 'staging-main-latest' }}
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment source
        env:
          SOURCE_REF: ${{ github.ref }}
          RELEASE_CALL_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/main && "$SOURCE_REF" != refs/tags/v* ]]; then
            echo "::error::Pinned staging deployment requires main or a validated release call."
            exit 1
          fi
          if [[ "$SOURCE_REF" == refs/tags/v* && -z "$RELEASE_CALL_SHA" ]]; then
            echo "::error::Tag staging deployment requires the validated release SHA."
            exit 1
          fi

  staging:
    needs: configuration
    if: github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && inputs.source_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment: staging
    concurrency:
      group: ${{ inputs.source_sha != '' && 'post-deploy-smoke-staging-pinned' || 'release-production' }}
      queue: max
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ARMADA_SERVER_URL: ${{ secrets.ARMADA_SERVER_URL }}
      RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
      STAGING_FORWARD_HISTORY: 'true'
      STAGING_EXACT_HISTORY: ${{ inputs.source_sha != '' && 'true' || 'false' }}
      STAGING_LATEST_ONLY: ${{ inputs.source_sha == '' && 'true' || 'false' }}
      ARMADA_URL: ${{ vars.ARMADA_ORIGIN }}
      ARMADA_TOKEN: ${{ secrets.ARMADA_SMOKE_TOKEN }}
      ARMADA_SMOKE_CASES: ${{ secrets.ARMADA_SMOKE_CASES }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || (github.event_name == 'workflow_run' && 'main') || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Authenticate ordinary staging source after acquiring admission
        id: admission
        if: inputs.source_sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            bun scripts/release/smoke-receipt.ts --release-completion "$GITHUB_EVENT_PATH" "$GH_REPO"
          fi
          echo "::notice::Staging admitted by release-production lock; no API status veto."
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # Historical source evidence cannot prove the release's exact SQL inventory.
      - name: Require fresh pinned acceptance or coalesce a completed ordinary deployment
        id: evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && -z "${{ inputs.source_sha }}" ]]; then
            RELEASE_VERSION=$(jq -r .version packages/core/package.json) bun scripts/release/staging-evidence.ts
          else
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Report coalesced completion wakeup
        if: steps.evidence.outputs.reused == 'true'
        run: |
          echo "::notice::Completion wakeup coalesced with successful deployment and smoke of the live staging SHA."
          echo "### Neutral: completion wakeup coalesced; no new deployment" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: (steps.evidence.outputs.reused != 'true' && inputs.official_image == true)
        with:
          name: official-sandbox-image
          path: packages/core/src
      - name: Validate configuration before any mutation
        if: (steps.evidence.outputs.reused != 'true')
        run: |
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID ARMADA_SERVER_URL ARMADA_URL ARMADA_TOKEN ARMADA_SMOKE_CASES; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing staging configuration: $key; production blocked."; exit 1; }
          done
          [[ "${ARMADA_URL%/}" == "${ARMADA_SERVER_URL%/}" ]] || {
            echo "::error::Smoke origin must match the deployed staging server; production blocked."
            exit 1
          }
          echo "RELEASE_VERSION=$(jq -r .version packages/core/package.json)" >> "$GITHUB_ENV"
      # Match production: deploy tooling comes from the executing workflow,
      # while git archive and all application sources stay on RELEASE_SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: (steps.evidence.outputs.reused != 'true')
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        if: (steps.evidence.outputs.reused != 'true')
        with:
          version: 2.75.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: (steps.evidence.outputs.reused != 'true')
        with:
          node-version: 24
      - name: Install pinned deployment clients
        if: (steps.evidence.outputs.reused != 'true')
        run: npm install --global @railway/cli@5.71.0 vercel@65.14.0
      # Stamp the checked-out SHA in ordinary wakeup evidence. GitHub run metadata
      # can describe an older main tip than the source resolved under the lock.
      - name: Migrate then deploy pinned server and dashboard${{ github.event_name == 'workflow_run' && inputs.source_sha == '' && format(' ({0})', env.RELEASE_SHA) || '' }}
        if: (steps.evidence.outputs.reused != 'true')
        id: deployment
        run: bash .release-tools/scripts/release/deploy-production.sh
      - run: bun install --frozen-lockfile
        if: (steps.evidence.outputs.reused != 'true' && steps.deployment.outputs.superseded != 'true')
      - name: Record Release completion provenance
        if: github.event_name == 'workflow_run'
        run: |
          mkdir -p .smoke
          jq '{id: .workflow_run.id}' "$GITHUB_EVENT_PATH" > .smoke/release-trigger.json
      - name: Restore staging smoke receipts across branches and tags
        if: (steps.evidence.outputs.reused != 'true' && steps.deployment.outputs.superseded != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .smoke
          gh api "repos/$GH_REPO/actions/artifacts?name=armada-staging-smoke-journal&per_page=100" > "$RUNNER_TEMP/smoke-artifacts.json"
          jq '[.artifacts[] | select(
            .workflow_run.head_repository_id == .workflow_run.repository_id and
            (.workflow_run.head_branch == "main" or (.workflow_run.head_branch | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9.-]+)?$"))))] | {artifacts: .}' \
            "$RUNNER_TEMP/smoke-artifacts.json" > "$RUNNER_TEMP/smoke-candidates.json"
          artifact=$(jq -r '.artifacts[0].id // empty' "$RUNNER_TEMP/smoke-candidates.json")
          if [[ -n "$artifact" ]]; then
            run=$(jq -r '.artifacts[0].workflow_run.id' "$RUNNER_TEMP/smoke-candidates.json")
            # Artifacts from arbitrary PR workflows must never authorize deletion.
            gh api "repos/$GH_REPO/actions/runs/$run" > "$RUNNER_TEMP/receipt-run.json"
            bun .release-tools/scripts/release/smoke-receipt.ts --producer-only "$RUNNER_TEMP/receipt-run.json" "$GH_REPO"
            gh api "repos/$GH_REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/smoke-journal.zip"
            release_args=()
            if [[ "$(jq -r .event "$RUNNER_TEMP/receipt-run.json")" == workflow_run ]]; then
              # This file is uploaded by the authenticated wakeup workflow itself.
              trigger=$(unzip -p "$RUNNER_TEMP/smoke-journal.zip" release-trigger.json | jq -er '.id | select(type == "number" and . > 0)')
              gh api "repos/$GH_REPO/actions/runs/$trigger" > "$RUNNER_TEMP/receipt-release.json"
              release_args=("$RUNNER_TEMP/receipt-release.json")
            fi
            bun .release-tools/scripts/release/smoke-receipt.ts "$RUNNER_TEMP/receipt-run.json" "$GH_REPO" "${release_args[@]}"
            unzip -p "$RUNNER_TEMP/smoke-journal.zip" sandboxes.json > .smoke/sandboxes.json
          fi
      - name: Smoke pinned staging
        if: (steps.evidence.outputs.reused != 'true' && steps.deployment.outputs.superseded != 'true')
        env:
          ARMADA_SMOKE: create_real_compute
          ARMADA_SMOKE_JOURNAL: .smoke/sandboxes.json
        run: |
          # Read probes receive only the existing staging bearer, never deployment secrets.
          env -i PATH="$PATH" HOME="$HOME" ARMADA_URL="$ARMADA_URL" ARMADA_TOKEN="$ARMADA_TOKEN" \
            ARMADA_SMOKE_CASES="$ARMADA_SMOKE_CASES" bun scripts/dashboard-read-smoke.ts &
          dashboard_pid=$!
          status=0
          env -i PATH="$PATH" HOME="$HOME" ARMADA_URL="$ARMADA_URL" ARMADA_TOKEN="$ARMADA_TOKEN" \
            ARMADA_SMOKE_CASES="$ARMADA_SMOKE_CASES" ARMADA_SMOKE="$ARMADA_SMOKE" ARMADA_SMOKE_JOURNAL="$ARMADA_SMOKE_JOURNAL" \
            bun scripts/post-deploy-smoke.ts --work-preservation --templates-skills --lifecycle --vault --default-skills --scoped-access --github-refresh --golden-runtime --expiry || status=$?
          wait "$dashboard_pid" || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: (steps.evidence.outputs.reused != 'true' && always() && hashFiles('.smoke/sandboxes.json') != '')
        with:
          name: armada-staging-smoke-journal
          path: |
            .smoke/sandboxes.json
            .smoke/release-trigger.json
          include-hidden-files: true
          retention-days: 30
      - name: Report blocked production
        if: (steps.evidence.outputs.reused != 'true' && failure())
        run: echo "::error::Staging deployment or smoke failed; production migrations and deployments are blocked."
