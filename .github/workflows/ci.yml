name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'merge_group' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  migration-versions:
    name: Migration versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Check migration versions against the current base
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Fetch now, not the potentially stale base SHA in the PR event.
            git fetch --no-tags origin "refs/heads/$BASE_BRANCH"
            base=$(git rev-parse FETCH_HEAD)
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Compare the entire queue candidate with its exact target-branch base.
            base="$MERGE_GROUP_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$BEFORE"
          else
            base=$(git rev-parse HEAD^)
          fi
          bun scripts/db/check-migrations.ts "$base"
      - name: Test migration guard
        run: bun test scripts/db/check-migrations.test.ts

  # Keeps the name of the required check of main.
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARMADA_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Check generated iOS harness metadata
        run: bun scripts/generate-ios-harness.ts --check
      - run: bun packages/agent-runtime/build.ts
      - run: bun scripts/validate-runtime-native.ts
      - name: Real checkpoint process boundary
        run: |
          sudo unshare --pid --fork --mount-proc "$(which bun)" packages/provider-modal/test/checkpoint-process-conformance.ts
          sudo unshare --pid --fork --mount-proc "$(which bun)" packages/provider-modal/test/checkpoint-process-conformance.ts --native-pidfds
      - run: bun run typecheck
      - name: Apply migrations to disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/db/supabase-prereq.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: |
          bun run test
          bun test ./packages/mcp-server/test/orchestrator-runtime-postgres.integration.ts
        env:
          CODEX_NATIVE_TEST_BINARY: ${{ github.workspace }}/packages/agent-runtime/dist/codex

  golden-concurrency:
    name: Golden PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: armada_adoption_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun scripts/prepare-runtime.ts
      - name: Apply migrations to disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: armada_adoption_test
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/db/supabase-prereq.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: bun test packages/core/test/github-runtime-postgres.test.ts packages/core/test/golden-adoption-postgres.test.ts packages/core/test/golden-build-jobs-postgres.test.ts packages/core/test/golden-snapshot-retirement.test.ts packages/core/test/golden-create.test.ts
        env:
          ARMADA_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/armada_adoption_test

  golden-os:
    name: Golden OS recipe (actual provider image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun scripts/prepare-runtime.ts
      - run: bun scripts/golden-os-image.ts
      - run: docker build -t armada-golden-os dist/golden-os-fixture
      - run: bun test packages/core/test/golden-os.test.ts packages/mcp-server/test/github-boat-os.test.ts packages/provider-modal/test/ssh-os.test.ts
        env:
          ARMADA_GOLDEN_OS_IMAGE: armada-golden-os

  # Separate jobs expose every terminal state; matrix aggregation can mask cancelled legs.
  e2e-1:
    name: Dashboard e2e (shard 1/3)
    uses: ./.github/workflows/dashboard-e2e-shard.yml
    with:
      shard: 1

  e2e-2:
    name: Dashboard e2e (shard 2/3)
    uses: ./.github/workflows/dashboard-e2e-shard.yml
    with:
      shard: 2

  e2e-3:
    name: Dashboard e2e (shard 3/3)
    uses: ./.github/workflows/dashboard-e2e-shard.yml
    with:
      shard: 3

  # Preserve the required check name. A skipped/cancelled/failed shard must never pass the gate.
  e2e:
    name: Dashboard e2e
    needs: [e2e-1, e2e-2, e2e-3]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_1: ${{ needs.e2e-1.result }}
          SHARD_2: ${{ needs.e2e-2.result }}
          SHARD_3: ${{ needs.e2e-3.result }}
        run: test "$SHARD_1" = success && test "$SHARD_2" = success && test "$SHARD_3" = success

  # Each binary is compiled on its own platform, so it is run there before upload
  # and the macOS ones get the ad-hoc signature Apple Silicon requires.
  binary:
    name: Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run build --target ${{ matrix.target }}
      - name: armada --version
        run: |
          expected=$(jq -r .version packages/core/package.json)
          actual=$(./dist/armada-${{ matrix.target }} --version)
          echo "armada --version: $actual"
          test "$actual" = "$expected"
      # The npm packages of this binary, packed, installed with npm and Bun, then run.
      - name: npm pack and install
        run: |
          bun scripts/npm.ts --binaries dist --target ${{ matrix.target }}
          mkdir -p dist/tarballs
          for dir in dist/npm/*/; do (cd "$dir" && npm pack --pack-destination ../../tarballs); done
          scripts/npm-smoke.sh dist/tarballs ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: armada-${{ matrix.target }}
          path: |
            dist/armada-${{ matrix.target }}
            dist/armada-server-${{ matrix.target }}
          if-no-files-found: error
