name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'merge_group' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ matrix.shard == 1 && '0' || '1' }}
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run lint
        if: matrix.shard == 1
      - run: bun scripts/generate-ios-harness.ts --check
        if: matrix.shard == 1
      - run: bun run typecheck
        if: matrix.shard == 1
      - name: Check complete unit shard coverage
        if: matrix.shard == 1
        run: bun scripts/ci/unit-shards.ts --check

      - name: Check migration versions against the current base
        if: matrix.shard == 1
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Fetch now, not the potentially stale base SHA in the PR event.
            git fetch --no-tags origin "refs/heads/$BASE_BRANCH"
            base=$(git rev-parse FETCH_HEAD)
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Compare the entire queue candidate with its exact target-branch base.
            base="$MERGE_GROUP_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$BEFORE"
          else
            base=$(git rev-parse HEAD^)
          fi
          bun scripts/db/check-migrations.ts "$base"
      - name: Test migration guard
        if: matrix.shard == 1
        run: bun test scripts/db/check-migrations.test.ts

      # Native/namespace conformance belongs to publishing release validation.
      - run: bun scripts/prepare-runtime.ts
      - name: Run balanced unit shard
        run: bun scripts/ci/unit-shards.ts ${{ matrix.shard }}

  # Keep the ruleset's required name; never turn skipped/cancelled children green.
  verify:
    name: Lint, typecheck and test
    needs: [unit-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
