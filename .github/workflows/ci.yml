name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keeps the name of the required check of main.
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  # The dashboard runs as a production build against a mock of Supabase and the Armada server.
  e2e:
    name: Dashboard e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/dashboard
      - run: bun run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: dashboard-e2e-results
          path: apps/dashboard/test-results
          if-no-files-found: ignore

  # Each binary is compiled on its own platform, so it is run there before upload
  # and the macOS ones get the ad-hoc signature Apple Silicon requires.
  binary:
    name: Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run build --target ${{ matrix.target }}
      - name: armada --version
        run: |
          expected=$(jq -r .version packages/core/package.json)
          actual=$(./dist/armada-${{ matrix.target }} --version)
          echo "armada --version: $actual"
          test "$actual" = "$expected"
      # The npm packages of this binary, packed, installed with npm and Bun, then run.
      - name: npm pack and install
        run: |
          bun scripts/npm.ts --binaries dist --target ${{ matrix.target }}
          mkdir -p dist/tarballs
          for dir in dist/npm/*/; do (cd "$dir" && npm pack --pack-destination ../../tarballs); done
          scripts/npm-smoke.sh dist/tarballs ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: armada-${{ matrix.target }}
          path: dist/armada-${{ matrix.target }}
          if-no-files-found: error
