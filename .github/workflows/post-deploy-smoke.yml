name: Post-deploy smoke

# Never subscribe to deployment_status: provider events also cover PR and
# gh-readonly-queue deployments, attaching long-running checks to their SHAs.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  staging-main:
    name: Deploy and smoke pinned main on staging
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/staging-gated-production.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
