name: Dashboard screenshot evidence

on:
  pull_request:
    paths:
      - "apps/dashboard/src/components/resource-browser.tsx"
      - "apps/dashboard/e2e/resource-layout.e2e.ts"
      - "apps/dashboard/scripts/capture-resource-evidence.ts"
      - ".github/workflows/dashboard-evidence.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Resource before/after evidence
    # Match the dashboard e2e runner rather than the rolling ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
      NEXT_PUBLIC_AUTH_PROVIDERS: github,google
      ARMADA_MCP_URL: http://127.0.0.1:54399/mcp
      # Disposable mock values, identical to playwright.config.ts. No real credentials/providers.
      ARMADA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GITHUB_APP_CLIENT_ID: Iv1.e2e
      GITHUB_APP_CLIENT_SECRET: e2e-client-secret
      GITHUB_APP_SLUG: armada-tvc
      GITHUB_APP_ID: "8675309"
      MOCK_PORT: "54399"
      DASHBOARD_ORIGIN: http://127.0.0.1:3100
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Capture the baseline and candidate layout against the same current mock
        shell: bash
        run: |
          set -euo pipefail
          component=src/components/resource-browser.tsx
          original=$(mktemp)
          cp "$component" "$original"
          app_pid=""
          mock_pid=""
          cleanup() {
            cp "$original" "$component"
            rm -f "$original"
            if [[ -n "$app_pid" ]]; then kill "$app_pid" 2>/dev/null || true; fi
            if [[ -n "$mock_pid" ]]; then kill "$mock_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          mkdir -p test-results/resource-evidence
          printf 'PR head: %s\nBaseline component: %s\nDownload this artifact, extract it, and open index.html for side-by-side comparisons. Only the ResourceBrowser component is substituted for the before capture; both phases use the current dashboard, mock and dependencies.\n' "$HEAD_SHA" "$BASE_SHA" > test-results/resource-evidence/README.txt
          bun e2e/mock-supabase.ts > test-results/resource-evidence/mock.log 2>&1 &
          mock_pid=$!
          for phase in before after; do
            if [[ "$phase" == before ]]; then
              git show "$BASE_SHA:apps/dashboard/$component" > "$component"
            else
              cp "$original" "$component"
            fi
            bunx next build
            NODE_OPTIONS=--require=./e2e/github-fetch.cjs node node_modules/next/dist/bin/next start -p 3100 -H 127.0.0.1 > "test-results/resource-evidence/$phase-server.log" 2>&1 &
            app_pid=$!
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:3100/login > /dev/null; then break; fi
              if ! kill -0 "$app_pid" 2>/dev/null; then cat "test-results/resource-evidence/$phase-server.log"; exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3100/login > /dev/null
            EVIDENCE_PHASE="$phase" bun scripts/capture-resource-evidence.ts
            kill "$app_pid"
            wait "$app_pid" || true
            app_pid=""
          done
          test "$(find test-results/resource-evidence -name '*.png' | wc -l)" -eq 32
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-before-after-${{ github.event.pull_request.head.sha }}
          path: |
            apps/dashboard/test-results/resource-evidence/*.png
            apps/dashboard/test-results/resource-evidence/*.txt
            apps/dashboard/test-results/resource-evidence/*.html
          if-no-files-found: error
          retention-days: 90
