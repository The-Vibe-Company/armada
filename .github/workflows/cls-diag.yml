# TEMPORARY (THE-982 diagnosis, removed before the pull request).
name: CLS diagnosis
on:
  push:
    branches: [feature/the-982-fix-the-overview-sometimes-shifts-its-layout-by-a-hair]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ARMADA_DASHBOARD_PASSWORD: ci-performance-budgets
      ARMADA_DASHBOARD_AUTHOR: CI
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: packages/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
      - run: |
          set -euo pipefail
          psql -h localhost -U postgres -c "create database fleet"
          ARMADA_DEMO_DATABASE_URL="postgres://postgres:postgres@localhost:5432/fleet" bun run demo:seed fleet
          ARMADA_DATABASE_URL=postgres://postgres:postgres@localhost:5432/fleet ARMADA_DASHBOARD_DEMO=fleet \
            nohup bunx next start --port 4822 > "$RUNNER_TEMP/fleet.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null localhost:4822/landing && exit 0; sleep 1; done
          exit 1
      - name: Lighthouse on / (mobile x3, desktop x1), six times
        run: for i in 1 2 3 4 5 6; do ARMADA_PERF_PAGES="/" bun run perf lighthouse http://localhost:4822 | grep -E "trace|shift|mobile|desktop|benchmark" || true; done
      - name: Playwright overflow watch on /, 25 loads
        run: bun scripts/_cls-diag.ts http://localhost:4822 / 25
