name: Account quality evidence

on:
  pull_request:
    paths:
      - "apps/dashboard/src/components/confirmed-action.tsx"
      - "apps/dashboard/src/components/personal-provider-keys.tsx"
      - "apps/dashboard/src/app/(app)/settings/page.tsx"
      - "apps/dashboard/scripts/capture-account-evidence.ts"
      - ".github/workflows/dashboard-account-evidence.yml"

permissions:
  contents: read

concurrency:
  group: account-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Account before/after evidence
    runs-on: ubuntu-24.04
    # Exact-version browser/dependency bundle for repeatable evidence.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
      NEXT_PUBLIC_AUTH_PROVIDERS: github,google
      ARMADA_MCP_URL: http://127.0.0.1:54399/mcp
      # Disposable mock values, identical to playwright.config.ts. No real credentials/providers.
      ARMADA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GITHUB_APP_CLIENT_ID: Iv1.e2e
      GITHUB_APP_CLIENT_SECRET: e2e-client-secret
      GITHUB_APP_SLUG: armada-tvc
      GITHUB_APP_ID: "8675309"
      MOCK_PORT: "54399"
      DASHBOARD_ORIGIN: http://127.0.0.1:3100
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up pinned Bun in the browser container
        working-directory: .
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install --global "bun@$version"
          test "$(bun --version)" = "$version"
      - run: bun install --frozen-lockfile
      - name: Validate bundled Chromium launches
        run: bun -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close();'
      - name: Capture the baseline and candidate layout against the same current mock
        shell: bash
        run: |
          set -euo pipefail
          original=$(mktemp -d)
          mkdir -p "$original/candidate"
          cp -a src test "$original/candidate/"
          app_pid=""
          mock_pid=""
          restore_source() {
            for directory in src test; do
              if [[ -d "$directory" ]]; then mv "$directory" "$original/previous-$directory-$(date +%s%N)"; fi
              cp -a "$original/candidate/$directory" "$directory"
            done
          }
          cleanup() {
            restore_source
            if [[ -n "$app_pid" ]]; then kill "$app_pid" 2>/dev/null || true; fi
            if [[ -n "$mock_pid" ]]; then kill "$mock_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          mkdir -p test-results/account-evidence
          printf 'PR head: %s\nBaseline dashboard source: %s\nDownload/extract and open index.html. Before uses baseline dashboard src/test trees; after restores candidate trees. Both use current mock/dependencies.\n' "$HEAD_SHA" "$BASE_SHA" > test-results/account-evidence/README.txt
          bun e2e/mock-supabase.ts > test-results/account-evidence/mock.log 2>&1 &
          mock_pid=$!
          for phase in before after; do
            restore_source
            if [[ "$phase" == before ]]; then
              mv src "$original/head-src"
              mv test "$original/head-test"
              git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" archive "$BASE_SHA" apps/dashboard/src apps/dashboard/test | tar -x -C "$original"
              cp -a "$original/apps/dashboard/src" src
              cp -a "$original/apps/dashboard/test" test
            fi
            bunx next build
            NODE_OPTIONS=--require=./e2e/github-fetch.cjs node node_modules/next/dist/bin/next start -p 3100 -H 127.0.0.1 > "test-results/account-evidence/$phase-server.log" 2>&1 &
            app_pid=$!
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:3100/login > /dev/null; then break; fi
              if ! kill -0 "$app_pid" 2>/dev/null; then cat "test-results/account-evidence/$phase-server.log"; exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3100/login > /dev/null
            EVIDENCE_PHASE="$phase" bun scripts/capture-account-evidence.ts
            kill "$app_pid"
            wait "$app_pid" || true
            app_pid=""
          done
          test "$(find test-results/account-evidence -name '*.png' | wc -l)" -eq 16
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-before-after-${{ github.event.pull_request.head.sha }}
          path: |
            apps/dashboard/test-results/account-evidence/*.png
            apps/dashboard/test-results/account-evidence/*.txt
            apps/dashboard/test-results/account-evidence/*.html
          if-no-files-found: error
          retention-days: 90
