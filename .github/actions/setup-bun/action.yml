name: Set up Bun
description: Bun at the version of packageManager, from GitHub releases or, when they fail, from npm.

runs:
  using: composite
  steps:
    - id: release
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      continue-on-error: true
      with:
        bun-version-file: package.json
    - name: Install Bun from npm
      if: steps.release.outcome == 'failure'
      shell: bash
      run: |
        version=$(jq -r '.packageManager | split("@")[1]' package.json)
        npm install --global --prefix "$HOME/.bun-npm" "bun@$version"
        echo "$HOME/.bun-npm/bin" >> "$GITHUB_PATH"
    - name: Bun version
      shell: bash
      run: bun --version
