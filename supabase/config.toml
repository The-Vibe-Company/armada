# Supabase CLI project. The schema lives in ./migrations (apply with
# `supabase db reset` or `supabase migration up`). A fresh Supabase database
# already has Auth (`auth.users`, `auth.uid()`) and the `authenticated` and
# `service_role` roles; the migrations assume them.
project_id = "armada"

[db]
major_version = 15

[db.migrations]
enabled = true

# Local template source only. Do not config-push this sparse file to production;
# see docs/auth-email-template.md for the two-field hosted deployment.
[auth.email.template.magic_link]
subject = "Your Armada sign-in code and link"
content_path = "./supabase/templates/magic-link.html"
